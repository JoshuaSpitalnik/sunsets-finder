name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main, master]
  # Refresh forecasters' posts (osint.json) every 30 minutes.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  # contents: write lets the job push new posts to the osint-data archive branch.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the post archive
        uses: actions/checkout@v4
        with:
          ref: osint-data
          path: osint-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Collect forecasters' posts
        run: node scripts/fetch-osint.mjs dist/osint.json --archive osint-data/archive
      - name: Save new posts to the archive branch
        working-directory: osint-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --quiet || (git commit -m "Archive forecasters' posts" && git push)
      - name: Publish the archive with the app
        run: cp -r osint-data/archive dist/osint-archive
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
